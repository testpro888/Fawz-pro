<!DOCTYPE html>
<html lang="id">
<head>
  <script src="config.js"></script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fawz Pro | Portofolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL = (window.__FAWZ_CONFIG__ || {}).supabaseUrl || '';
    const SUPABASE_KEY = (window.__FAWZ_CONFIG__ || {}).supabaseKey || '';
    try { window._supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); }
    catch(e) { console.error('Supabase init:', e); }
    window.addEventListener('DOMContentLoaded', () => {
      if (!window._supabase && window.supabase)
        window._supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      initPage();
    });
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy:#0d0d2b; --purple:#1e1252; --gold:#f5a623; --gold-light:#ffc857;
      --bg:#f4f5fb; --border:#e0e0ef; --text:#1a1a3a; --gray:#888;
      --green:#27ae60; --red:#e74c3c; --blue:#2980b9; --nav-h:68px;
    }
    body { font-family:'Inter',sans-serif; background:var(--bg); min-height:100vh; padding-top:var(--nav-h); color:var(--text); }
    .page-container { max-width:1300px; margin:0 auto; padding:36px 28px; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)} }

    .page-header { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:28px; flex-wrap:wrap; gap:16px; animation:fadeUp .4s ease both; }
    .page-title { font-size:2rem; font-weight:900; color:var(--navy); }
    .page-subtitle { font-size:.88rem; color:var(--gray); margin-top:4px; }
    .title-underline { width:48px; height:3px; background:linear-gradient(90deg,var(--gold),var(--gold-light)); border-radius:2px; margin-top:8px; }

    .btn { display:inline-flex; align-items:center; gap:7px; padding:10px 18px; border-radius:10px; font-family:'Inter',sans-serif; font-size:.85rem; font-weight:600; cursor:pointer; border:none; transition:all .2s; }
    .btn-primary { background:linear-gradient(135deg,var(--gold),#e8931a); color:#fff; box-shadow:0 4px 14px rgba(245,166,35,.35); }
    .btn-primary:hover { transform:translateY(-2px); box-shadow:0 8px 22px rgba(245,166,35,.45); }
    .btn-outline { background:#fff; color:var(--navy); border:1.5px solid var(--border); }
    .btn-outline:hover { border-color:var(--gold); color:var(--gold); }
    .btn-danger { background:linear-gradient(135deg,var(--red),#c0392b); color:#fff; }
    .btn-sm { padding:7px 14px; font-size:.78rem; }

    /* Client selector */
    .selector-bar { background:#fff; border-radius:14px; padding:18px 22px; display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin-bottom:24px; box-shadow:0 2px 10px rgba(0,0,0,.05); animation:fadeUp .4s .05s ease both; }
    .selector-bar label { font-size:.82rem; font-weight:600; color:var(--navy); }
    .selector-bar select { padding:10px 14px; border:1.5px solid var(--border); border-radius:10px; font-family:'Inter',sans-serif; font-size:.875rem; outline:none; background:#fff; cursor:pointer; min-width:260px; }
    .selector-bar select:focus { border-color:var(--gold); }
    .client-info { font-size:.85rem; color:var(--gray); margin-left:8px; }
    .client-info strong { color:var(--navy); }

    /* Container sections */
    .section-card { background:#fff; border-radius:16px; box-shadow:0 2px 12px rgba(0,0,0,.06); overflow:hidden; margin-bottom:28px; animation:fadeUp .4s .1s ease both; }
    .section-header { padding:18px 22px; border-bottom:1px solid #f0f0f5; display:flex; align-items:center; justify-content:space-between; }
    .section-title { font-size:1.05rem; font-weight:700; color:var(--navy); }

    /* Table */
    .table-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; font-size:.855rem; }
    thead { background:linear-gradient(135deg,var(--navy),var(--purple)); }
    thead th { padding:13px 14px; text-align:left; font-size:.7rem; font-weight:700; color:rgba(255,255,255,.8); text-transform:uppercase; letter-spacing:1px; white-space:nowrap; }
    tbody tr { border-bottom:1px solid #f5f5fa; transition:background .12s; }
    tbody tr:last-child { border-bottom:none; }
    tbody tr:hover { background:#fffbf3; }
    tbody td { padding:12px 14px; vertical-align:middle; }
    .empty-state { text-align:center; padding:40px 20px; color:#bbb; font-size:.9rem; }

    /* Summary row */
    .summary-row { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; padding:16px 22px; border-top:1px solid #f0f0f5; background:#fafafa; }
    .summary-item label { font-size:.7rem; color:var(--gray); text-transform:uppercase; letter-spacing:.5px; display:block; margin-bottom:4px; }
    .summary-item .val { font-size:1.1rem; font-weight:700; color:var(--navy); }

    /* Form */
    .form-row { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px,1fr)); gap:12px; padding:16px 22px; }
    .form-group { display:flex; flex-direction:column; gap:4px; }
    .form-group label { font-size:.72rem; font-weight:600; color:var(--gray); text-transform:uppercase; letter-spacing:.5px; }
    .form-group input, .form-group select { padding:9px 12px; border:1.5px solid var(--border); border-radius:8px; font-family:'Inter',sans-serif; font-size:.85rem; outline:none; transition:border .2s; }
    .form-group input:focus, .form-group select:focus { border-color:var(--gold); }
    .form-group input[readonly] { background:#f9f9f9; color:var(--gray); }
    .form-actions { padding:12px 22px; border-top:1px solid #f0f0f5; display:flex; gap:10px; justify-content:flex-end; }

    /* Badge */
    .badge-buy { background:#e8f5e9; color:#2e7d32; display:inline-block; padding:3px 10px; border-radius:20px; font-size:.7rem; font-weight:700; }
    .badge-sell { background:#fce4ec; color:#c62828; display:inline-block; padding:3px 10px; border-radius:20px; font-size:.7rem; font-weight:700; }

    /* Responsive */
    @media(max-width:768px) {
      .selector-bar { flex-direction:column; align-items:stretch; }
      .selector-bar select { min-width:100%; }
      .summary-row { grid-template-columns:1fr; }
      .form-row { grid-template-columns:1fr 1fr; }
    }
  </style>
</head>
<body>

<!-- NAVBAR -->
<div id="navbar-placeholder"></div>
<script src="navbar.js?v=3"></script>

<!-- PAGE -->
<div class="page-container">
  <div class="page-header">
    <div>
      <div class="page-title">Portofolio</div>
      <div class="page-subtitle">Lihat dan kelola portofolio saham per nasabah</div>
      <div class="title-underline"></div>
    </div>
  </div>

  <!-- Client Selector -->
  <div class="selector-bar">
    <label>Client ID:</label>
    <select id="clientSelect" onchange="loadPortfolio()">
      <option value="">— Pilih Client —</option>
    </select>
    <span class="client-info" id="clientInfo"></span>
  </div>

  <!-- ═══ CONTAINER 1: Tabel Portofolio ═══ -->
  <div class="section-card">
    <div class="section-header">
      <div class="section-title">📊 Portofolio</div>
      <button class="btn btn-primary btn-sm" onclick="savePortfolio()">💾 Save</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Stock</th>
            <th>Qty (Lot)</th>
            <th>Buy Price</th>
            <th>Nominal</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="portfolioBody">
          <tr><td colspan="5" class="empty-state">Pilih Client ID untuk melihat portofolio</td></tr>
        </tbody>
      </table>
    </div>
    <!-- Summary: Cash Balance, Buy Fee, Sell Fee -->
    <div class="summary-row">
      <div class="summary-item">
        <label>Cash Balance</label>
        <div class="val" id="cashBalanceDisplay">Rp 0</div>
        <input type="number" id="cashBalanceInput" placeholder="0" style="margin-top:6px; padding:7px 10px; border:1.5px solid var(--border); border-radius:8px; font-size:.85rem; width:100%; outline:none;" oninput="this.style.borderColor='var(--gold)'"/>
      </div>
      <div class="summary-item">
        <label>Buy Fee (%)</label>
        <div class="val" id="buyFeeDisplay">0%</div>
        <input type="number" step="0.01" id="buyFeeInput" placeholder="0.15" style="margin-top:6px; padding:7px 10px; border:1.5px solid var(--border); border-radius:8px; font-size:.85rem; width:100%; outline:none;" oninput="this.style.borderColor='var(--gold)'"/>
      </div>
      <div class="summary-item">
        <label>Sell Fee (%)</label>
        <div class="val" id="sellFeeDisplay">0%</div>
        <input type="number" step="0.01" id="sellFeeInput" placeholder="0.25" style="margin-top:6px; padding:7px 10px; border:1.5px solid var(--border); border-radius:8px; font-size:.85rem; width:100%; outline:none;" oninput="this.style.borderColor='var(--gold)'"/>
      </div>
    </div>
  </div>

  <!-- ═══ CONTAINER 2: Input Transaksi ═══ -->
  <div class="section-card">
    <div class="section-header">
      <div class="section-title">📝 Input Transaksi</div>
    </div>
    <!-- Form input transaksi -->
    <div class="form-row">
      <div class="form-group">
        <label>Stock</label>
        <input type="text" id="txStock" placeholder="e.g. BBCA" style="text-transform:uppercase"/>
      </div>
      <div class="form-group">
        <label>Transaksi</label>
        <select id="txType">
          <option value="Buy">Buy</option>
          <option value="Sell">Sell</option>
        </select>
      </div>
      <div class="form-group">
        <label>Qty (Lot)</label>
        <input type="number" id="txQty" placeholder="0" min="1" oninput="calcTxNominal()"/>
      </div>
      <div class="form-group">
        <label>Price</label>
        <input type="number" id="txPrice" placeholder="0" min="0" oninput="calcTxNominal()"/>
      </div>
      <div class="form-group">
        <label>Nominal</label>
        <input type="text" id="txNominal" readonly placeholder="Auto"/>
      </div>
      <div class="form-group">
        <label>Buy Fee</label>
        <input type="text" id="txBuyFee" readonly placeholder="Auto"/>
      </div>
      <div class="form-group">
        <label>Sell Fee</label>
        <input type="text" id="txSellFee" readonly placeholder="Auto"/>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" onclick="submitTransaction()">+ Tambah Transaksi</button>
    </div>

    <!-- Tabel history transaksi -->
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Tanggal</th>
            <th>Stock</th>
            <th>Transaksi</th>
            <th>Qty (Lot)</th>
            <th>Price</th>
            <th>Nominal</th>
            <th>Buy Fee</th>
            <th>Sell Fee</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="transactionBody">
          <tr><td colspan="9" class="empty-state">Belum ada transaksi</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div><!-- end page-container -->

<script>
let customers = [];
let portfolioData = [];
let transactionData = [];
let selectedCustomerId = null;

async function initPage() {
  await loadClients();
}

// ══════ LOAD CLIENTS ══════
async function loadClients() {
  const { data, error } = await window._supabase
    .from('customers')
    .select('id, client_id, name')
    .order('client_id');
  if (error) { console.error(error); return; }
  customers = data || [];
  const sel = document.getElementById('clientSelect');
  sel.innerHTML = '<option value="">— Pilih Client —</option>';
  customers.forEach(c => {
    sel.innerHTML += `<option value="${c.id}" data-name="${c.name}">${c.client_id} — ${c.name}</option>`;
  });
}

// ══════ LOAD PORTFOLIO ══════
async function loadPortfolio() {
  const sel = document.getElementById('clientSelect');
  selectedCustomerId = sel.value;
  const opt = sel.options[sel.selectedIndex];
  const infoEl = document.getElementById('clientInfo');

  if (!selectedCustomerId) {
    infoEl.innerHTML = '';
    document.getElementById('portfolioBody').innerHTML = '<tr><td colspan="5" class="empty-state">Pilih Client ID untuk melihat portofolio</td></tr>';
    document.getElementById('transactionBody').innerHTML = '<tr><td colspan="9" class="empty-state">Belum ada transaksi</td></tr>';
    resetSummary();
    return;
  }

  infoEl.innerHTML = `<strong>${opt.dataset.name || ''}</strong>`;

  // Load portfolio
  const { data: porto, error: e1 } = await window._supabase
    .from('customer_portfolio')
    .select('*')
    .eq('customer_id', selectedCustomerId)
    .order('stock');
  if (e1) console.error(e1);
  portfolioData = porto || [];
  renderPortfolio();

  // Load transactions
  const { data: txs, error: e2 } = await window._supabase
    .from('portfolio_transactions')
    .select('*')
    .eq('customer_id', selectedCustomerId)
    .order('created_at', { ascending: false });
  if (e2) console.error(e2);
  transactionData = txs || [];
  renderTransactions();

  // Load summary (use first row's fees/balance or defaults)
  if (portfolioData.length > 0) {
    const first = portfolioData[0];
    document.getElementById('cashBalanceInput').value = first.cash_balance || 0;
    document.getElementById('buyFeeInput').value = first.buy_fee || 0;
    document.getElementById('sellFeeInput').value = first.sell_fee || 0;
    document.getElementById('cashBalanceDisplay').textContent = formatRp(first.cash_balance || 0);
    document.getElementById('buyFeeDisplay').textContent = (first.buy_fee || 0) + '%';
    document.getElementById('sellFeeDisplay').textContent = (first.sell_fee || 0) + '%';
  } else {
    resetSummary();
  }
}

function resetSummary() {
  document.getElementById('cashBalanceInput').value = '';
  document.getElementById('buyFeeInput').value = '';
  document.getElementById('sellFeeInput').value = '';
  document.getElementById('cashBalanceDisplay').textContent = 'Rp 0';
  document.getElementById('buyFeeDisplay').textContent = '0%';
  document.getElementById('sellFeeDisplay').textContent = '0%';
}

// ══════ RENDER PORTFOLIO TABLE ══════
function renderPortfolio() {
  const tbody = document.getElementById('portfolioBody');
  if (portfolioData.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty-state">Belum ada data portofolio</td></tr>';
    return;
  }
  tbody.innerHTML = portfolioData.map(p => `
    <tr>
      <td><strong>${p.stock}</strong></td>
      <td>${formatNum(p.qty_lot)}</td>
      <td>${formatRp(p.buy_price)}</td>
      <td>${formatRp(p.qty_lot * 100 * p.buy_price)}</td>
      <td><button class="btn btn-danger btn-sm" onclick="deletePortfolioRow('${p.id}')">🗑️</button></td>
    </tr>
  `).join('');
}

// ══════ RENDER TRANSACTIONS TABLE ══════
function renderTransactions() {
  const tbody = document.getElementById('transactionBody');
  if (transactionData.length === 0) {
    tbody.innerHTML = '<tr><td colspan="9" class="empty-state">Belum ada transaksi</td></tr>';
    return;
  }
  tbody.innerHTML = transactionData.map(t => {
    const nominal = t.qty_lot * 100 * t.price;
    const badgeClass = t.transaction_type === 'Buy' ? 'badge-buy' : 'badge-sell';
    const date = new Date(t.created_at).toLocaleDateString('id-ID', { day:'2-digit', month:'short', year:'numeric' });
    return `
    <tr>
      <td>${date}</td>
      <td><strong>${t.stock}</strong></td>
      <td><span class="${badgeClass}">${t.transaction_type}</span></td>
      <td>${formatNum(t.qty_lot)}</td>
      <td>${formatRp(t.price)}</td>
      <td>${formatRp(nominal)}</td>
      <td>${formatRp(t.buy_fee)}</td>
      <td>${formatRp(t.sell_fee)}</td>
      <td><button class="btn btn-danger btn-sm" onclick="deleteTransaction('${t.id}')">🗑️</button></td>
    </tr>`;
  }).join('');
}

// ══════ CALC TRANSACTION NOMINAL & FEES ══════
function calcTxNominal() {
  const qty = parseFloat(document.getElementById('txQty').value) || 0;
  const price = parseFloat(document.getElementById('txPrice').value) || 0;
  const nominal = qty * 100 * price;
  const buyFeePercent = parseFloat(document.getElementById('buyFeeInput').value) || 0;
  const sellFeePercent = parseFloat(document.getElementById('sellFeeInput').value) || 0;
  const txType = document.getElementById('txType').value;

  document.getElementById('txNominal').value = formatRp(nominal);

  if (txType === 'Buy') {
    document.getElementById('txBuyFee').value = formatRp(nominal * buyFeePercent / 100);
    document.getElementById('txSellFee').value = 'Rp 0';
  } else {
    document.getElementById('txBuyFee').value = 'Rp 0';
    document.getElementById('txSellFee').value = formatRp(nominal * sellFeePercent / 100);
  }
}

// Recalc when type changes
document.addEventListener('DOMContentLoaded', () => {
  const txTypeEl = document.getElementById('txType');
  if (txTypeEl) txTypeEl.addEventListener('change', calcTxNominal);
});

// ══════ SUBMIT TRANSACTION ══════
async function submitTransaction() {
  if (!selectedCustomerId) { alert('Pilih Client ID terlebih dahulu'); return; }

  const stock = document.getElementById('txStock').value.trim().toUpperCase();
  const txType = document.getElementById('txType').value;
  const qty = parseFloat(document.getElementById('txQty').value) || 0;
  const price = parseFloat(document.getElementById('txPrice').value) || 0;

  if (!stock || qty <= 0 || price <= 0) { alert('Lengkapi data transaksi'); return; }

  const nominal = qty * 100 * price;
  const buyFeePercent = parseFloat(document.getElementById('buyFeeInput').value) || 0;
  const sellFeePercent = parseFloat(document.getElementById('sellFeeInput').value) || 0;
  const buyFee = txType === 'Buy' ? nominal * buyFeePercent / 100 : 0;
  const sellFee = txType === 'Sell' ? nominal * sellFeePercent / 100 : 0;

  // Get client_id text
  const sel = document.getElementById('clientSelect');
  const cust = customers.find(c => c.id === selectedCustomerId);
  const clientIdText = cust ? cust.client_id : '';

  const { error } = await window._supabase
    .from('portfolio_transactions')
    .insert({
      customer_id: selectedCustomerId,
      client_id: clientIdText,
      stock,
      transaction_type: txType,
      qty_lot: qty,
      price,
      buy_fee: buyFee,
      sell_fee: sellFee
    });

  if (error) { alert('Gagal menyimpan: ' + error.message); return; }

  // Clear form
  document.getElementById('txStock').value = '';
  document.getElementById('txQty').value = '';
  document.getElementById('txPrice').value = '';
  document.getElementById('txNominal').value = '';
  document.getElementById('txBuyFee').value = '';
  document.getElementById('txSellFee').value = '';

  // Reload
  loadPortfolio();
}

// ══════ SAVE PORTFOLIO (Cash Balance, Buy Fee, Sell Fee) ══════
async function savePortfolio() {
  if (!selectedCustomerId) { alert('Pilih Client ID terlebih dahulu'); return; }

  const cashBalance = parseFloat(document.getElementById('cashBalanceInput').value) || 0;
  const buyFee = parseFloat(document.getElementById('buyFeeInput').value) || 0;
  const sellFee = parseFloat(document.getElementById('sellFeeInput').value) || 0;

  // Update semua row portofolio milik customer ini
  const { error } = await window._supabase
    .from('customer_portfolio')
    .update({ cash_balance: cashBalance, buy_fee: buyFee, sell_fee: sellFee })
    .eq('customer_id', selectedCustomerId);

  if (error) { alert('Gagal menyimpan: ' + error.message); return; }

  // Jika belum ada row, insert satu row placeholder
  if (portfolioData.length === 0) {
    const cust = customers.find(c => c.id === selectedCustomerId);
    await window._supabase.from('customer_portfolio').insert({
      customer_id: selectedCustomerId,
      client_id: cust ? cust.client_id : '',
      stock: '-',
      qty_lot: 0,
      buy_price: 0,
      cash_balance: cashBalance,
      buy_fee: buyFee,
      sell_fee: sellFee
    });
  }

  // Update display
  document.getElementById('cashBalanceDisplay').textContent = formatRp(cashBalance);
  document.getElementById('buyFeeDisplay').textContent = buyFee + '%';
  document.getElementById('sellFeeDisplay').textContent = sellFee + '%';
  alert('✅ Portofolio berhasil disimpan');
  loadPortfolio();
}

// ══════ DELETE ══════
async function deletePortfolioRow(id) {
  if (!confirm('Hapus data portofolio ini?')) return;
  await window._supabase.from('customer_portfolio').delete().eq('id', id);
  loadPortfolio();
}

async function deleteTransaction(id) {
  if (!confirm('Hapus transaksi ini?')) return;
  await window._supabase.from('portfolio_transactions').delete().eq('id', id);
  loadPortfolio();
}

// ══════ UTILS ══════
function formatRp(num) {
  return 'Rp ' + Number(num || 0).toLocaleString('id-ID');
}
function formatNum(num) {
  return Number(num || 0).toLocaleString('id-ID');
}
</script>

</body>
</html>
